name: flutter_bloc_clean_architecture_template
description: "A Flutter template implementing Clean Architecture with BLoC pattern"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  get_it: ^7.7.0
  injectable: ^2.1.0
  intl: any
  json_annotation: ^4.8.1
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.1
  shared_preferences: ^2.3.2
  go_router: ^14.2.8
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.1
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.2.0
  loading_animation_widget: ^1.2.0
  email_validator: ^2.0.1
  equatable: ^2.0.5
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^17.2.3
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.1
  change_app_package_name: ^1.5.0
  logger: ^2.4.0
  dartz: ^0.10.1
  internet_connection_checker: ^1.0.0+1

dev_dependencies:
  flutter_flavorizr: ^2.2.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  retrofit_generator: ^9.1.2
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

# Easy Localization
easy_localization:
  assets_path: assets/translations
  output_dir: lib/core/localization
  output_file: locale_keys.g.dart

flutter:
  uses-material-design: true
  assets:
    - assets/translations/en.json
    - assets/translations/ne.json
    - .env
